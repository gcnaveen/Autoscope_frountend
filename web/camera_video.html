<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Auto Scope Video</title>
  <style>
    body { margin: 0; font-family: Arial, sans-serif; background: #0b0f14; color: white; }
    .wrap { padding: 14px; }
    .card { border: 1px solid rgba(255,255,255,.12); border-radius: 12px; overflow: hidden; background: #111827; }
    video { width: 100%; height: 360px; background: black; object-fit: cover; display: block; }
    .row { display: flex; gap: 10px; margin-top: 12px; flex-wrap: wrap; }
    button {
      flex: 1; padding: 10px 12px; border-radius: 10px;
      border: 1px solid rgba(255,255,255,.18);
      background: rgba(255,255,255,.08);
      color: white; font-weight: 700; cursor: pointer;
      min-width: 140px;
    }
    button.primary { background: #2563eb; border-color: #2563eb; }
    button.danger { background: #ef4444; border-color: #ef4444; }
    button:disabled { opacity: .6; cursor: not-allowed; }
    .hint { margin-top: 10px; font-size: 12px; opacity: .85; line-height: 1.35; }
    .err { margin-top: 10px; color: #fecaca; font-size: 12px; }
    .pill { display:inline-block; padding:6px 10px; border:1px solid rgba(255,255,255,.18); border-radius:999px; font-size:12px; opacity:.9; }
  </style>
</head>

<body>
  <div class="wrap">
    <h3 style="margin: 6px 0 12px;">Auto Scope Video</h3>

    <div class="card">
      <video id="video" autoplay playsinline muted></video>
    </div>

    <div class="row">
      <span class="pill" id="timer">00:00</span>
      <button id="cancelBtn">Cancel</button>
      <button id="startBtn" class="primary" disabled>Start Recording</button>
      <button id="stopBtn" class="danger" disabled>Stop</button>
      <button id="useBtn" class="primary" disabled>Use Video</button>
    </div>

    <div class="hint">
      If preview is blank, allow camera permission for this site.
      <br/>Video format is usually <b>video/webm</b> on Chrome/Edge.
    </div>

    <div id="err" class="err"></div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const reqId = params.get("id") || "";

    const videoEl = document.getElementById("video");
    const startBtn = document.getElementById("startBtn");
    const stopBtn  = document.getElementById("stopBtn");
    const useBtn   = document.getElementById("useBtn");
    const cancelBtn = document.getElementById("cancelBtn");
    const err = document.getElementById("err");
    const timerEl = document.getElementById("timer");

    let stream = null;
    let recorder = null;
    let chunks = [];
    let recordedBlob = null;

    let t0 = 0;
    let tick = null;

    function send(type, payload) {
      if (window.opener) {
        // Use same-origin for safety (if opener is same origin)
        const origin = window.location.origin;
        window.opener.postMessage(
          { source: "autoscope_camera", id: reqId, type, ...payload },
          origin
        );
      }
    }

    function fmt(sec) {
      const m = Math.floor(sec / 60).toString().padLeft ? Math.floor(sec / 60).toString().padStart(2,'0') : ('0'+Math.floor(sec/60)).slice(-2);
      const s = Math.floor(sec % 60).toString().padStart(2,'0');
      return `${m}:${s}`;
    }

    function startTimer() {
      t0 = Date.now();
      timerEl.textContent = "00:00";
      tick = setInterval(() => {
        const sec = (Date.now() - t0) / 1000;
        timerEl.textContent = fmt(sec);
      }, 250);
    }

    function stopTimer() {
      if (tick) clearInterval(tick);
      tick = null;
    }

    async function startCamera() {
      try {
        stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: { ideal: "environment" } },
          audio: true
        });

        videoEl.srcObject = stream;
        await videoEl.play();
        startBtn.disabled = false;
      } catch (e) {
        err.textContent = "Camera error: " + (e && e.message ? e.message : e);
        send("error", { message: err.textContent });
      }
    }

    function stopCamera() {
      if (stream) {
        stream.getTracks().forEach(t => t.stop());
        stream = null;
      }
    }

    function pickMimeType() {
      const candidates = [
        "video/webm;codecs=vp9,opus",
        "video/webm;codecs=vp8,opus",
        "video/webm",
      ];
      for (const t of candidates) {
        if (window.MediaRecorder && MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(t)) {
          return t;
        }
      }
      return ""; // let browser decide
    }

    startBtn.addEventListener("click", () => {
      try {
        recordedBlob = null;
        chunks = [];

        const mimeType = pickMimeType();
        recorder = mimeType
          ? new MediaRecorder(stream, { mimeType })
          : new MediaRecorder(stream);

        recorder.ondataavailable = (ev) => {
          if (ev.data && ev.data.size > 0) chunks.push(ev.data);
        };

        recorder.onstop = () => {
          recordedBlob = new Blob(chunks, { type: recorder.mimeType || "video/webm" });
          useBtn.disabled = false;
        };

        recorder.start(250); // collect in chunks
        startBtn.disabled = true;
        stopBtn.disabled = false;
        useBtn.disabled = true;

        startTimer();
      } catch (e) {
        err.textContent = "Recorder error: " + (e && e.message ? e.message : e);
        send("error", { message: err.textContent });
      }
    });

    stopBtn.addEventListener("click", () => {
      try {
        if (recorder && recorder.state !== "inactive") recorder.stop();
        stopBtn.disabled = true;
        startBtn.disabled = false;
        stopTimer();
      } catch (e) {
        err.textContent = "Stop failed: " + (e && e.message ? e.message : e);
        send("error", { message: err.textContent });
      }
    });

    useBtn.addEventListener("click", () => {
      try {
        if (!recordedBlob) return;

        const fileName = `inspection-video-${Date.now()}.webm`;
        const contentType = recordedBlob.type || "video/webm";

        // Send blob back to opener (Flutter)
        send("video_captured", { fileName, contentType, blob: recordedBlob });

        stopCamera();
        window.close();
      } catch (e) {
        err.textContent = "Use video failed: " + (e && e.message ? e.message : e);
        send("error", { message: err.textContent });
      }
    });

    cancelBtn.addEventListener("click", () => {
      send("cancel", {});
      stopCamera();
      window.close();
    });

    window.addEventListener("beforeunload", () => {
      stopTimer();
      stopCamera();
    });

    startCamera();
  </script>
</body>
</html>
