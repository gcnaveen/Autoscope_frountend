<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Auto Scope Camera</title>
  <style>
    body { margin: 0; font-family: Arial, sans-serif; background: #0b0f14; color: white; }
    .wrap { padding: 14px; }
    .card { border: 1px solid rgba(255,255,255,.12); border-radius: 12px; overflow: hidden; background: #111827; }
    video { width: 100%; height: 360px; background: black; object-fit: cover; display: block; }
    .row { display: flex; gap: 10px; margin-top: 12px; }
    button {
      flex: 1; padding: 10px 12px; border-radius: 10px;
      border: 1px solid rgba(255,255,255,.18);
      background: rgba(255,255,255,.08);
      color: white; font-weight: 700; cursor: pointer;
    }
    button.primary { background: #2563eb; border-color: #2563eb; }
    button:disabled { opacity: .6; cursor: not-allowed; }
    .hint { margin-top: 10px; font-size: 12px; opacity: .8; line-height: 1.35; }
    .err { margin-top: 10px; color: #fecaca; font-size: 12px; }
  </style>
</head>

<body>
  <div class="wrap">
    <h3 style="margin: 6px 0 12px;">Auto Scope Camera</h3>

    <div class="card">
      <video id="video" autoplay playsinline></video>
    </div>

    <div class="row">
      <button id="cancelBtn">Cancel</button>
      <button id="captureBtn" class="primary" disabled>Capture</button>
    </div>

    <div class="hint">
      If preview is blank, allow camera permission for this site.
    </div>

    <div id="err" class="err"></div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const reqId = params.get("id") || "";

    const video = document.getElementById("video");
    const captureBtn = document.getElementById("captureBtn");
    const cancelBtn = document.getElementById("cancelBtn");
    const err = document.getElementById("err");

    let stream = null;

    function send(type, dataUrl) {
      if (window.opener) {
        window.opener.postMessage(
          { source: "autoscope_camera", id: reqId, type: type, dataUrl: dataUrl },
          "*"
        );
      }
    }

    async function start() {
      try {
        stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: { ideal: "environment" } },
          audio: false
        });

        video.srcObject = stream;
        await video.play();
        captureBtn.disabled = false;
      } catch (e) {
        err.textContent = "Camera error: " + (e && e.message ? e.message : e);
        send("error", null);
      }
    }

    function stop() {
      if (stream) {
        stream.getTracks().forEach(t => t.stop());
        stream = null;
      }
    }

    captureBtn.addEventListener("click", () => {
      try {
        const w = video.videoWidth || 1280;
        const h = video.videoHeight || 720;
        const canvas = document.createElement("canvas");
        canvas.width = w;
        canvas.height = h;
        const ctx = canvas.getContext("2d");
        ctx.drawImage(video, 0, 0, w, h);
        const dataUrl = canvas.toDataURL("image/png");

        send("captured", dataUrl);
        stop();
        window.close();
      } catch (e) {
        err.textContent = "Capture failed: " + (e && e.message ? e.message : e);
        send("error", null);
      }
    });

    cancelBtn.addEventListener("click", () => {
      send("cancel", null);
      stop();
      window.close();
    });

    window.addEventListener("beforeunload", () => stop());

    start();
  </script>
</body>
</html>
